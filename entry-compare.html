<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>V05 · 入户光厅对照</title><style>body{margin:0;background:#f7f0df;color:#54412c;font:16px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1400px;margin:40px auto;padding:0 28px}h1{font-size:30px;font-weight:500}p{max-width:1000px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;background:white;border-radius:18px;padding:20px}figcaption{font-weight:bold;margin-bottom:12px}svg,img{display:block;width:100%;height:630px;object-fit:contain}a{color:#936633}small{color:#807462}@media(max-width:800px){.compare{grid-template-columns:1fr}svg,img{height:auto}}</style><main><h1>把入户光厅和进门的地方对齐</h1><p>左侧是你提供的原始户型图局部，右侧是 V05 实际模型的正投影俯视截图。两边方向一致；箭头表示从光厅穿过入户门，再经玄关向左进入餐厅。</p><div class="compare"><figure><figcaption>01 / 原始户型图 · 入口局部</figcaption><svg viewBox="965 290 355 310"><image href="evidence/floorplan.jpg" width="1608" height="1080"/></svg></figure><figure><figcaption>02 / V05 模型 · 入口核对视角</figcaption><img src="evidence/v02-entry-model.png" alt="实际模型入口，含电梯、设备井、楼梯及进门路线"></figure></div><p>本次修正：恢复绕电梯井的不规则光厅和门前平台；入户门移回原图位置；玄关左侧向餐厅敞开；区分楼梯门与入户门；取消无原图依据的阳台—光厅直通门。</p><p><a href="/sunlit-home-177/?view=entry">打开可旋转、可进入的 V05 小屋 →</a></p><small>墙线与门洞依据原图描摹，原图未标注的门窗高度和家具细节仍为 Q 版示意；本页不代表施工测量图。完整轮廓叠加可在小屋右上角「户型依据」查看。</small></main></html>
